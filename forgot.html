<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CloudPulse WhatsApp API</title>
    <style>
        :root {
            --bg: #0b141a;
            --surface: #111b21;
            --accent: #00a884;
            --accent-hover: #008f72;
            --text: #e9edef;
            --text-secondary: #8696a0;
            --border: #222d34;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(24px, 6vw, 36px) clamp(18px, 5vw, 28px);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.18s ease;
            min-height: 44px;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: background 0.18s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .status-box {
            display: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: #a7f3d0;
            line-height: 1.4;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="logo-wrap">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            CloudPulse
        </a>

        <h1>Reset Password</h1>
        <p class="subtitle">Enter your registered email to receive a password reset link.</p>

        <div id="statusBox" class="status-box"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Account Email</label>
                <input type="email" id="email" placeholder="name@company.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn" id="resetBtn">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            Remembered your credentials? <a href="login.html">Sign in</a>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const statusBox = document.getElementById('statusBox');
        const resetBtn = document.getElementById('resetBtn');

        forgotForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            resetBtn.disabled = true;
            resetBtn.textContent = 'Sending...';

            setTimeout(() => {
                statusBox.innerHTML = `✓ A secure password recovery link has been dispatched to <strong>${email}</strong>. Please check your inbox or spam folder.`;
                statusBox.style.display = 'block';
                resetBtn.style.display = 'none';
                document.getElementById('email').disabled = true;
            }, 600);
        });
    </script>
</body>
</html>
